app = "spine"
primary_region = "lhr"

[build]

[env]
  DATA_DIR = "/data"
  SECURE_COOKIES = "1"
  PORT = "3000"

[[mounts]]
  source = "spine_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
